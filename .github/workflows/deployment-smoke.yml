name: Deployment smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: novel-ci-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated offline deployment
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=sqlite:////app/data/novel_generator.db
          ARTIFACTS_DIR=/app/artifacts
          OLLAMA_BASE_URL=http://127.0.0.1:1
          DEFAULT_MODEL=offline-smoke
          OLLAMA_MODEL_MAINTENANCE=off
          WORKER_EXCLUSIVE=true
          MAX_CONCURRENT_RUNS=1
          EOF
          docker compose config --quiet
      - name: Build and start packaged web and worker
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify liveness and write persisted test project
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health/live
          docker compose exec -T web python - <<'PY'
          from pathlib import Path
          from sqlalchemy import text
          from novel_generator.dependencies import get_session_factory
          from novel_generator.repositories import create_project
          from novel_generator.schemas import ProjectCreate
          from novel_generator.settings import get_settings

          settings = get_settings()
          with get_session_factory()() as session:
              assert session.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              create_project(session, ProjectCreate(
                  title="Deployment persistence smoke", premise="An isolated deployment check.",
                  desired_word_count=1500, requested_chapters=3,
                  min_words_per_chapter=400, max_words_per_chapter=600,
                  preferred_model="offline-smoke",
              ))
              session.commit()
          (settings.artifacts_dir / "deployment-smoke.txt").write_text("preserved", encoding="utf-8")
          PY
          docker compose logs worker | grep -F "runtime transforms."
      - name: Recreate containers without removing named volumes
        run: docker compose up -d --force-recreate --wait --wait-timeout 120
      - name: Verify persistent database and artifact volumes
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health/live
          docker compose exec -T web python - <<'PY'
          from novel_generator.dependencies import get_session_factory
          from novel_generator.repositories import list_projects
          from novel_generator.settings import get_settings
          with get_session_factory()() as session:
              assert any(project.title == "Deployment persistence smoke" for project in list_projects(session))
          assert (get_settings().artifacts_dir / "deployment-smoke.txt").read_text(encoding="utf-8") == "preserved"
          PY
          docker compose logs worker | grep -F "runtime transforms."
          for service in web worker; do
            container="$(docker compose ps -q "$service")"
            test "$(docker inspect -f '{{.State.Running}}' "$container")" = true
            test "$(docker inspect -f '{{.RestartCount}}' "$container")" = 0
          done
      - name: Collect deployment diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 web worker
      - name: Remove isolated CI deployment
        if: always()
        run: docker compose down -v --remove-orphans
